name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.EnhancedNextUp.slnx

      - name: Build
        run: dotnet build Jellyfin.Plugin.EnhancedNextUp.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Jellyfin.Plugin.EnhancedNextUp.slnx --configuration Release --no-build --verbosity normal
