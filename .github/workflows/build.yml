name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.NextUpRecentlyWatched.slnx

      - name: Build
        run: dotnet build Jellyfin.Plugin.NextUpRecentlyWatched.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Jellyfin.Plugin.NextUpRecentlyWatched.slnx --configuration Release --no-build --verbosity normal

      - name: Stage plugin
        run: |
          mkdir -p artifacts/jellyfin-12
          cp src/Jellyfin.Plugin.NextUpRecentlyWatched/bin/Release/net10.0/Jellyfin.Plugin.NextUpRecentlyWatched.dll artifacts/jellyfin-12/
          cp meta.json artifacts/jellyfin-12/

      - name: Upload plugin build
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-12
          path: artifacts/jellyfin-12
