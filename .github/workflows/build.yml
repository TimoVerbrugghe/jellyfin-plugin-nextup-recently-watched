name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - framework: net9.0
            jellyfin: jellyfin-10.11
            metadata: meta.json
          - framework: net10.0
            jellyfin: jellyfin-12
            metadata: meta-jellyfin12.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.NextUpRecentlyWatched.slnx -p:TargetFramework=${{ matrix.framework }}

      - name: Build
        run: dotnet build Jellyfin.Plugin.NextUpRecentlyWatched.slnx --framework ${{ matrix.framework }} --configuration Release --no-restore

      - name: Test
        run: dotnet test Jellyfin.Plugin.NextUpRecentlyWatched.slnx --framework ${{ matrix.framework }} --configuration Release --no-build --verbosity normal

      - name: Stage plugin
        run: |
          mkdir -p artifacts/${{ matrix.jellyfin }}
          cp src/Jellyfin.Plugin.NextUpRecentlyWatched/bin/Release/${{ matrix.framework }}/Jellyfin.Plugin.NextUpRecentlyWatched.dll artifacts/${{ matrix.jellyfin }}/
          cp ${{ matrix.metadata }} artifacts/${{ matrix.jellyfin }}/meta.json

      - name: Upload plugin build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.jellyfin }}
          path: artifacts/${{ matrix.jellyfin }}
